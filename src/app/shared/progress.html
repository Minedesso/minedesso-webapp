<div class="progress-meta">
  <span>{{ label() }}</span
  ><strong
    >{{ value() | number: '1.0-0' }}{{ suffix() }} / {{ max() | number: '1.0-0'
    }}{{ suffix() }}</strong
  >
</div>
<div
  class="progress-track"
  role="progressbar"
  [attr.aria-valuenow]="value()"
  aria-valuemin="0"
  [attr.aria-valuemax]="max()"
>
  <span [style.width.%]="percentage"></span>
</div>
